name: Daily finance sync

on:
  schedule:
    - cron: "17 4 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

concurrency:
  group: daily-finance-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        name: Check cloud sync configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
        run: |
          if [[ -n "$DATABASE_URL" && -n "$PLAID_CLIENT_ID" && -n "$PLAID_SECRET" && -n "$TOKEN_ENCRYPTION_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Daily sync is installed but waiting for its required repository secrets."
          fi

  sync:
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
      PLAID_ENV: ${{ vars.PLAID_ENV || 'production' }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CLASSIFIER_MODEL: ${{ vars.OPENAI_CLASSIFIER_MODEL || 'gpt-4o-mini' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out Ledgerly
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Build the private sync runner
        run: npm run build

      - name: Start Ledgerly locally on the runner
        run: |
          npm run start > /tmp/ledgerly-sync-server.log 2>&1 &
          echo $! > /tmp/ledgerly-sync-server.pid
          for attempt in {1..60}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ledgerly-sync-server.log
          exit 1

      - name: Sync Plaid accounts, transactions, and investments
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            http://127.0.0.1:3000/api/plaid/sync \
            | tee /tmp/ledgerly-sync-result.json

      - name: Write run summary
        if: always()
        run: |
          echo "## Ledgerly daily sync" >> "$GITHUB_STEP_SUMMARY"
          echo "Run time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f /tmp/ledgerly-sync-result.json ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/ledgerly-sync-result.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The sync did not produce a result." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/ledgerly-sync-server.log || true
